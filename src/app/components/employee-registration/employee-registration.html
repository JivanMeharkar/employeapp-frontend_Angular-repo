<div class="form-container">

<h2>
  {{ isEditMode ? 'Edit Employee' : 'Employee Registration' }}
</h2>

<form (ngSubmit)="saveEmployee()" #employeeForm="ngForm">

<label>First Name</label>
<input type="text"
[(ngModel)]="employee.firstName"
name="firstName">

<label>Last Name</label>
<input type="text"
[(ngModel)]="employee.lastName"
name="lastName">

<label>Email</label>
<input type="email"
[(ngModel)]="employee.email"
name="email">

<label>Mobile</label>
<input type="text"
[(ngModel)]="employee.mobile"
name="mobile">

<label>Department</label>
<input type="text"
[(ngModel)]="employee.department"
name="department">

<label>Designation</label>
<input type="text"
[(ngModel)]="employee.designation"
name="designation">

<label>Salary</label>
<input type="number"
[(ngModel)]="employee.salary"
name="salary">

<button type="button" (click)="saveEmployee()">
  {{ isEditMode ? 'Update Employee' : 'Register Employee' }}
</button>

</form>

</div>
